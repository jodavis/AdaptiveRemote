version: '3.8'

services:
  compiledlayoutservice:
    build:
      context: .
      dockerfile: src/AdaptiveRemote.Backend.CompiledLayoutService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - backend

networks:
  backend:
    driver: bridge
