# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
  displayName: Install NuGet

- task: NuGetCommand@2
  displayName: Download NuGet packages
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  displayName: Build ($(buildConfiguration))
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSTest@2
  displayName: Run unit tests ($(buildConfiguration))
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSBuild@1
  inputs:
    solution: '**\AdaptiveRemote.csproj'
    msbuildArgs: '/t:Publish /p:PublishProfile=ClickOnceProfile /p:PublishDir="$(Build.ArtifactStagingDirectory)\installer" /p:PublishReadyToRun=True'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\installer'
    ArtifactName: 'installer'
    publishLocation: 'Container'