name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/*'

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Required for Nerdbank.GitVersioning
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      id: build
      run: dotnet build --no-restore /warnaserror

    - name: Install Chromium browser for Playwright headless tests
      shell: pwsh
      run: pwsh ./src/AdaptiveRemote.Headless/bin/Debug/net10.0/playwright.ps1 install chromium
    
    - name: Unit Tests 
      run: dotnet test --no-build --verbosity normal --logger trx --results-directory "TestResults" ./scripts/validate-unit-tests.proj --filter "TestCategory!=ApiIntegrationTest"

    - name: E2E Tests
      run: dotnet test --no-build --verbosity normal --logger trx --results-directory "TestResults" ./scripts/validate-e2e-tests.proj -m:1
      if: always() && steps.build.outcome == 'success'

    - name: Upload E2E Test Logs
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: e2e-test-logs
        path: |
          TestResults/**/*.log
        retention-days: 30

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: always()
      with:
        files: |
          TestResults/**/*.trx

  backend-api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend.slnf

    - name: Build
      run: dotnet build backend.slnf --no-restore /warnaserror

    - name: Pull LocalStack image
      run: docker pull localstack/localstack:3.0

    - name: API Integration Tests
      run: dotnet test --no-build --verbosity normal --logger trx --results-directory "TestResults" backend.slnf --filter "TestCategory=ApiIntegrationTest" -m:1

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          TestResults/**/*.trx
